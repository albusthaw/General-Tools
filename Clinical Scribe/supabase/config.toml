# Supabase settings for Clinical Scribe.
#
# Most of this file only affects the local development stack (`supabase start`).
# On a hosted project, the deploy reads the [functions.*] sections when it deploys
# the Edge Functions; sign-in settings for the hosted project are applied by
# build/deploy/deploy.mjs through the Management API, not from this file.

project_id = "clinical-scribe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
# Local only: points the worker wake-up call at the local functions server.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173", "http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Only administrators add people; nobody can sign themselves up.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.rate_limit]
token_refresh = 150
sign_in_sign_ups = 300
token_verifications = 30

[auth.email]
# Keeps email-and-password sign-in switched on. New sign-ups are still blocked by
# enable_signup = false in [auth] above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false

# Every function checks the caller itself (user token, admin role, or the worker
# secret), which is what the publishable and secret API keys require.
[functions.worker]
verify_jwt = false

[functions.templates-ai]
verify_jwt = false

[functions.admin]
verify_jwt = false

# Public connection details for the phone apps: public values only, no sign-in.
[functions.connect]
verify_jwt = false
